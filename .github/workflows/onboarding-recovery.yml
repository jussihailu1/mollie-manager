name: Manual onboarding recovery
on:
  # Automatic recovery runs from operations/onboarding-recovery-worker.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onboarding-recovery-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run protected onboarding worker
        env:
          RECOVERY_SECRET: ${{ secrets.ONBOARDING_RECOVERY_SECRET }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.RECOVERY_SECRET) throw new Error('Recovery secret is missing');
          const response = await fetch('https://kify.app/api/cron/onboarding', {
            method: 'POST',
            redirect: 'error',
            headers: { Authorization: `Bearer ${process.env.RECOVERY_SECRET}`, 'X-Kify-Recovery-Trigger': process.env.TRIGGER_EVENT },
            signal: AbortSignal.timeout(90000),
          });
          if (!response.ok) throw new Error(`Onboarding recovery failed: HTTP ${response.status}`);
          const result = await response.json();
          if (result.status !== 'ok') throw new Error('Onboarding recovery incomplete');
          console.log(`Onboarding recovery completed: ${result.runId}; trigger=${process.env.TRIGGER_EVENT}`);
          JS
